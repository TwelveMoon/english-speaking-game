<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>池東國小英語學習站</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .prevent-select {
            user-select: none;
            -webkit-user-select: none;
        }
        /* 簡單的淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans prevent-select">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- 選單資料設定 ---
        const GRADES = [
            { id: 'g3', label: '三年級' },
            { id: 'g4', label: '四年級' },
            { id: 'g5', label: '五年級' },
            { id: 'g6', label: '六年級' }
        ];

        const SEMESTERS = [
            { id: 's1', label: '上學期' },
            { id: 's2', label: '下學期' }
        ];

        const LESSONS = [
            { id: 'l1', label: '第一課' },
            { id: 'l2', label: '第二課' },
            { id: 'l3', label: '第三課' },
            { id: 'l4', label: '第四課' }
        ];

        const ACTIVITIES = [
            { id: 'vocab', label: '單字挑戰', icon: '📝', color: 'bg-blue-500 hover:bg-blue-600' },
            { id: 'sentence', label: '句型朗誦', icon: '🗣️', color: 'bg-emerald-500 hover:bg-emerald-600' },
            { id: 'text', label: '課文跟讀', icon: '📖', color: 'bg-amber-500 hover:bg-amber-600' }
        ];

        function App() {
            const [selectedGrade, setSelectedGrade] = useState(null);
            const [selectedSemester, setSelectedSemester] = useState(null);
            const [selectedLesson, setSelectedLesson] = useState(null);

            // 處理重置選擇
            const resetSelection = (level) => {
                if (level === 'grade') {
                    setSelectedGrade(null);
                    setSelectedSemester(null);
                    setSelectedLesson(null);
                } else if (level === 'semester') {
                    setSelectedSemester(null);
                    setSelectedLesson(null);
                } else if (level === 'lesson') {
                    setSelectedLesson(null);
                }
            };

            // 組合網址並跳轉
            const handleActivityClick = (activityId) => {
                // 網址命名規則範例： g3-s2-l1-vocab
                const folderName = `${selectedGrade.id}-${selectedSemester.id}-${selectedLesson.id}-${activityId}`;
                
                // 跳轉至該資料夾 (假設遊戲檔案都放在專案對應名稱的資料夾內)
                window.location.href = `./${folderName}/`;
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-4xl mx-auto">
                    
                    <header className="text-center mb-10 mt-4">
                        <h1 className="text-4xl md:text-5xl font-extrabold text-blue-700 mb-3 drop-shadow-sm">
                            英語語音挑戰站
                        </h1>
                        <p className="text-slate-500 text-lg">請依序選擇年級與課次來開始挑戰</p>
                    </header>

                    <main className="space-y-6">
                        
                        {/* 步驟 1：選擇年級 */}
                        <section className="bg-white rounded-2xl shadow-sm p-6 border-2 border-slate-100">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold text-slate-700">1. 選擇年級</h2>
                                {selectedGrade && (
                                    <button onClick={() => resetSelection('grade')} className="text-sm text-slate-400 hover:text-red-500 font-bold">
                                        重新選擇
                                    </button>
                                )}
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {GRADES.map(grade => (
                                    <button
                                        key={grade.id}
                                        onClick={() => { setSelectedGrade(grade); setSelectedSemester(null); setSelectedLesson(null); }}
                                        className={`py-4 rounded-xl font-bold text-lg transition-all border-2
                                            ${selectedGrade?.id === grade.id 
                                                ? 'bg-blue-100 border-blue-500 text-blue-700 shadow-inner' 
                                                : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-blue-50 hover:border-blue-300'}
                                        `}
                                    >
                                        {grade.label}
                                    </button>
                                ))}
                            </div>
                        </section>

                        {/* 步驟 2：選擇學期 */}
                        {selectedGrade && (
                            <section className="bg-white rounded-2xl shadow-sm p-6 border-2 border-slate-100 animate-fade-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-slate-700">2. 選擇學期</h2>
                                    {selectedSemester && (
                                        <button onClick={() => resetSelection('semester')} className="text-sm text-slate-400 hover:text-red-500 font-bold">
                                            重新選擇
                                        </button>
                                    )}
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    {SEMESTERS.map(semester => (
                                        <button
                                            key={semester.id}
                                            onClick={() => { setSelectedSemester(semester); setSelectedLesson(null); }}
                                            className={`py-4 rounded-xl font-bold text-lg transition-all border-2
                                                ${selectedSemester?.id === semester.id 
                                                    ? 'bg-indigo-100 border-indigo-500 text-indigo-700 shadow-inner' 
                                                    : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-indigo-50 hover:border-indigo-300'}
                                            `}
                                        >
                                            {semester.label}
                                        </button>
                                    ))}
                                </div>
                            </section>
                        )}

                        {/* 步驟 3：選擇課次 */}
                        {selectedSemester && (
                            <section className="bg-white rounded-2xl shadow-sm p-6 border-2 border-slate-100 animate-fade-in">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-bold text-slate-700">3. 選擇課次</h2>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    {LESSONS.map(lesson => (
                                        <button
                                            key={lesson.id}
                                            onClick={() => setSelectedLesson(lesson)}
                                            className={`py-4 rounded-xl font-bold text-lg transition-all border-2
                                                ${selectedLesson?.id === lesson.id 
                                                    ? 'bg-purple-100 border-purple-500 text-purple-700 shadow-inner' 
                                                    : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-purple-50 hover:border-purple-300'}
                                            `}
                                        >
                                            {lesson.label}
                                        </button>
                                    ))}
                                </div>
                            </section>
                        )}

                        {/* 步驟 4：選擇挑戰模式 (最終入口) */}
                        {selectedLesson && (
                            <section className="bg-white rounded-2xl shadow-md p-6 border-2 border-blue-200 animate-fade-in mt-8">
                                <h2 className="text-2xl font-black text-center text-slate-800 mb-2">
                                    {selectedGrade.label} {selectedSemester.label} {selectedLesson.label}
                                </h2>
                                <p className="text-center text-slate-500 mb-6">準備好麥克風，選擇一項挑戰開始！</p>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {ACTIVITIES.map(activity => (
                                        <button
                                            key={activity.id}
                                            onClick={() => handleActivityClick(activity.id)}
                                            className={`${activity.color} text-white py-6 rounded-2xl font-bold text-2xl flex flex-col items-center justify-center gap-3 transition-transform hover:scale-105 active:scale-95 shadow-md`}
                                        >
                                            <span className="text-4xl">{activity.icon}</span>
                                            {activity.label}
                                        </button>
                                    ))}
                                </div>
                            </section>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
