<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語語音達人 - 句型朗誦</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .prevent-select {
            user-select: none;
            -webkit-user-select: none;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .mic-active {
            animation: pulse-ring 1.5s infinite;
        }
        .slide-in-right {
            animation: slideIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes slideIn {
            0% { transform: translateX(50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .success-flash {
            animation: successFlash 0.8s ease-out forwards;
        }
        @keyframes successFlash {
            0% { background-color: #dcfce7; transform: scale(1); }
            50% { background-color: #86efac; transform: scale(1.02); }
            100% { background-color: #dcfce7; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- 句型題庫區 (三年級上學期第一課：年齡詢問與單字抽換) ---
        const SENTENCES = [
            // 核心句型與單字抽換練習
            { en: "How old are you?", zh: "你幾歲？" },
            { en: "I'm six.", zh: "我六歲。" },
            { en: "I'm six years old.", zh: "我六歲。" },

            { en: "How old are you?", zh: "你幾歲？" },
            { en: "I'm seven.", zh: "我七歲。" },
            { en: "I'm seven years old.", zh: "我七歲。" },

            { en: "How old are you?", zh: "你幾歲？" },
            { en: "I'm eight.", zh: "我八歲。" },
            { en: "I'm eight years old.", zh: "我八歲。" },

            { en: "How old are you?", zh: "你幾歲？" },
            { en: "I'm nine.", zh: "我九歲。" },
            { en: "I'm nine years old.", zh: "我九歲。" },

            { en: "How old are you?", zh: "你幾歲？" },
            { en: "I'm ten.", zh: "我十歲。" },
            { en: "I'm ten years old.", zh: "我十歲。" },

            // 補充句型
            { en: "Thank you.", zh: "謝謝你。" },
            { en: "You're welcome.", zh: "不客氣。" }
        ];

        // --- Icons ---
        const IconCheckCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        );
        const IconTrophy = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7c0 6 6 10 6 10s6-4 6-10V2z"></path></svg>
        );
        const IconRefreshCcw = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
        );
        const IconPlay = ({ size = 24, className = "", fill="none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const IconMic = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
        );
        const IconMicOff = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="2" y1="2" x2="22" y2="22"></line><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path><path d="M5 10v2a7 7 0 0 0 12 5l-2.7-2.7a4.5 4.5 0 0 1-6.3-6.3L5 6.13Z"></path><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33l1.67 1.67H11a1 1 0 0 1 1 1v2.34Z"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
        );

        function App() {
            const [gameState, setGameState] = useState('start'); 
            const [currentIndex, setCurrentIndex] = useState(0); 
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [isSuccessAnim, setIsSuccessAnim] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            
            const recognitionRef = useRef(null);
            const manualStopRef = useRef(true); 
            const gameStateRef = useRef(gameState);
            const currentIndexRef = useRef(currentIndex);

            useEffect(() => { gameStateRef.current = gameState; }, [gameState]);
            useEffect(() => { currentIndexRef.current = currentIndex; }, [currentIndex]);

            // --- 判斷過關邏輯：完成所有句子 ---
            useEffect(() => {
                if (currentIndex >= SENTENCES.length && SENTENCES.length > 0) {
                    manualStopRef.current = true;
                    if (recognitionRef.current) recognitionRef.current.stop();
                    setIsListening(false);
                    setGameState('game_complete');
                }
            }, [currentIndex]);

            // --- 初始化語音辨識 ---
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                if (!SpeechRecognition) {
                    setErrorMsg('您的瀏覽器不支援語音辨識功能，請使用 Google Chrome。');
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true; // 開啟即時辨識
                recognition.lang = 'en-US'; 

                recognition.onstart = () => {
                    setIsListening(true);
                    setErrorMsg('');
                };

                recognition.onresult = (event) => {
                    let liveTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        liveTranscript += event.results[i][0].transcript;
                    }
                    const resultText = liveTranscript.toLowerCase().trim();
                    setTranscript(resultText);
                    checkSentenceMatch(resultText); 
                };

                recognition.onerror = (event) => {
                    if (event.error === 'not-allowed') {
                        setErrorMsg('請允許瀏覽器使用麥克風權限。');
                        manualStopRef.current = true; 
                    }
                    setIsListening(false);
                };

                recognition.onend = () => {
                    setIsListening(false);
                    if (!manualStopRef.current && gameStateRef.current === 'playing') {
                        try { recognition.start(); } catch (e) {}
                    }
                };

                recognitionRef.current = recognition;

                return () => {
                    manualStopRef.current = true;
                    if (recognitionRef.current) recognitionRef.current.stop();
                };
            }, []);

            // --- 句型寬鬆比對邏輯 ---
            const checkSentenceMatch = useCallback((spokenText) => {
                if (currentIndexRef.current >= SENTENCES.length) return;

                const currentSentenceObj = SENTENCES[currentIndexRef.current];
                
                // 1. 標準化使用者的語音 (去除標點，轉陣列)
                const normalizedSpokenWords = spokenText.replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/);
                
                // 2. 標準化目標句子 (去除標點，轉陣列)
                // 特別處理 I'm, you're 這種縮寫，避免被拆散
                const targetText = currentSentenceObj.en.toLowerCase().replace(/['']/g, ''); 
                const targetWords = targetText.replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/);

                // 3. 計算命中率 (使用者說出的字，涵蓋了幾個目標句子的字)
                let matchCount = 0;
                targetWords.forEach(tw => {
                    if (normalizedSpokenWords.includes(tw)) {
                        matchCount++;
                    }
                });

                // 4. 過關條件：只要講對 70% 的單字就算過關
                const matchRate = matchCount / targetWords.length;
                
                if (matchRate >= 0.7) {
                    triggerNextSentence();
                }
            }, []);

            const triggerNextSentence = () => {
                // 防止重複觸發
                if (isSuccessAnim) return; 
                
                setIsSuccessAnim(true);
                
                setTimeout(() => {
                    setTranscript('');
                    setCurrentIndex(prev => prev + 1);
                    setIsSuccessAnim(false);
                }, 1000); // 顯示一秒鐘的綠色成功畫面再切換
            };

            const toggleListening = () => {
                if (errorMsg && !recognitionRef.current) return;
                if (isListening) {
                    manualStopRef.current = true; 
                    recognitionRef.current.stop();
                } else {
                    manualStopRef.current = false; 
                    try { recognitionRef.current.start(); } catch (e) {}
                }
            };

            const startGame = () => {
                setGameState('playing');
                setCurrentIndex(0);
                setTranscript('');
                setIsSuccessAnim(false);
                
                manualStopRef.current = false;
                setTimeout(() => {
                    if (recognitionRef.current && !isListening) {
                        try { recognitionRef.current.start(); } catch (e) {}
                    }
                }, 500);
            };

            const resetGame = () => {
                setGameState('start');
                setCurrentIndex(0);
                setTranscript('');
                manualStopRef.current = true;
                if (recognitionRef.current) recognitionRef.current.stop();
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans prevent-select p-4 md:p-8">
                    <header className="bg-white shadow-sm p-4 flex flex-col md:flex-row items-center justify-between rounded-2xl mb-8 max-w-4xl mx-auto">
                        <div className="flex items-center gap-2 font-bold text-xl text-emerald-600 mb-2 md:mb-0">
                            <IconMic className="text-emerald-500" />
                            英語語音達人 - 句型朗誦
                        </div>
                        {gameState === 'playing' && (
                            <div className="bg-slate-100 text-slate-500 font-bold px-4 py-2 rounded-full text-sm border">
                                進度：{currentIndex + 1} / {SENTENCES.length}
                            </div>
                        )}
                    </header>

                    <main className="max-w-4xl mx-auto flex flex-col items-center justify-center min-h-[60vh]">
                        
                        {gameState === 'start' && (
                            <div className="text-center space-y-8 animate-in fade-in duration-500">
                                <div className="bg-emerald-100 w-32 h-32 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                                    <IconMic size={64} className="text-emerald-500" />
                                </div>
                                <h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 mb-4">
                                    準備好挑戰對話了嗎？
                                </h1>
                                <p className="text-lg text-slate-600 mb-8 max-w-md mx-auto">
                                    畫面上會依序出現句子，請跟著唸出來！<br/>
                                    只要唸對大部分的字就能過關喔！
                                </p>
                                <button 
                                    onClick={startGame}
                                    className="bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-bold py-4 px-12 rounded-full shadow-lg shadow-emerald-200 transform transition hover:scale-105 active:scale-95 flex items-center gap-2 mx-auto"
                                >
                                    <IconPlay fill="currentColor" /> 開始挑戰
                                </button>
                            </div>
                        )}

                        {gameState === 'playing' && currentIndex < SENTENCES.length && (
                            <div className="w-full max-w-2xl mx-auto animate-in zoom-in duration-300 flex flex-col items-center">
                                
                                {/* 句子顯示卡片 */}
                                <div key={currentIndex} className={`w-full bg-white rounded-3xl shadow-xl p-10 md:p-14 mb-10 text-center border-4 border-slate-100 transition-colors duration-300 slide-in-right ${isSuccessAnim ? 'success-flash border-emerald-300' : ''}`}>
                                    {isSuccessAnim ? (
                                        <div className="flex flex-col items-center justify-center h-32 text-emerald-600">
                                            <IconCheckCircle size={64} className="mb-4" />
                                            <span className="text-2xl font-bold">Excellent!</span>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center min-h-[8rem]">
                                            <h2 className="text-4xl md:text-5xl font-black text-slate-800 mb-6 leading-tight">
                                                {SENTENCES[currentIndex].en}
                                            </h2>
                                            <p className="text-2xl font-bold text-slate-400">
                                                {SENTENCES[currentIndex].zh}
                                            </p>
                                        </div>
                                    )}
                                </div>

                                {/* 麥克風與即時回饋區 */}
                                <div className="flex flex-col items-center justify-center w-full">
                                    <button
                                        onClick={toggleListening}
                                        className={`w-24 h-24 flex items-center justify-center rounded-full text-white transition-all shadow-lg mb-6
                                            ${isListening && !isSuccessAnim ? 'bg-red-500 mic-active' : 'bg-emerald-500 hover:bg-emerald-600'}
                                            ${errorMsg ? 'opacity-50 cursor-not-allowed' : ''}
                                        `}
                                    >
                                        {isListening ? <IconMic size={48} /> : <IconMicOff size={48} />}
                                    </button>
                                    
                                    <div className="h-12 flex items-center justify-center text-center px-4 w-full">
                                        {transcript && !isSuccessAnim && (
                                            <span className="text-xl text-slate-500">
                                                系統聽到: <strong className="text-emerald-600 font-bold">{transcript}</strong>
                                            </span>
                                        )}
                                        {!transcript && isListening && !isSuccessAnim && (
                                            <span className="text-lg text-slate-400 font-semibold animate-pulse">
                                                請唸出畫面上的英文句子...
                                            </span>
                                        )}
                                    </div>
                                    
                                    {errorMsg && (
                                        <p className="mt-2 text-red-500 font-semibold">{errorMsg}</p>
                                    )}
                                </div>
                            </div>
                        )}

                        {gameState === 'game_complete' && (
                            <div className="text-center space-y-6 animate-in zoom-in duration-700">
                                <div className="bg-yellow-100 w-40 h-40 rounded-full flex items-center justify-center mx-auto mb-6 shadow-xl">
                                    <IconTrophy size={80} className="text-yellow-500" />
                                </div>
                                <h1 className="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-orange-500 pb-2">
                                    對話大師！
                                </h1>
                                <p className="text-2xl text-slate-600 max-w-md mx-auto">
                                    太流暢了！你成功唸完了所有的句型。
                                </p>
                                <button 
                                    onClick={resetGame}
                                    className="mt-8 bg-slate-800 hover:bg-slate-900 text-white text-xl font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 flex items-center gap-2 mx-auto"
                                >
                                    <IconRefreshCcw /> 再挑戰一次
                                </button>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
